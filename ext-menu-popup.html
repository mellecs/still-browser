<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; src: url('fonts/inter-latin-wght-normal.woff2') format('woff2'); }
  :root { --bg: #292a2d; --hover: #3a3b3f; --border: #3c3d40; --text: #ffffff; --muted: #c4c7c5; --accent: #5b9bff; }
  html, body { margin: 0; background: transparent; overflow: hidden; font: 13px 'Inter', 'Segoe UI', system-ui, sans-serif; color: var(--text); user-select: none; }
  body { padding: 8px; }
  svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #panel { box-sizing: border-box; padding: 6px; border-radius: 14px; background: var(--bg); border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
  .hd { padding: 6px 10px 8px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sep { height: 1px; background: var(--border); margin: 4px; }
  .it { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .it:hover { background: var(--hover); }
  .it svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
  .it.off { opacity: 0.4; cursor: default; pointer-events: none; }
  .it.danger { color: var(--text); }
  .it.sure { background: var(--hover); }
</style>
</head>
<body>
<div id="panel"></div>
<script>
  const api = window.emApi;
  const panel = document.getElementById('panel');
  let es = true, lastH = 0;
  const T = (a, b) => (es ? a : b);
  const ICO_PIN = '<svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3H7l3-3z"/></svg>';
  const ICO_OPT = '<svg viewBox="0 0 24 24"><path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="8" cy="17" r="2"/></svg>';
  const ICO_DEL = '<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
  const applyTheme = (th) => { try { const r = document.documentElement.style; Object.keys(th || {}).forEach((k) => r.setProperty('--' + k, th[k])); } catch (e) {} };
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function item(icono, texto, cls, fn) {
    const b = el('button', 'it' + (cls ? ' ' + cls : ''));
    b.innerHTML = icono;
    b.appendChild(el('span', '', texto));
    b.onclick = fn;
    return b;
  }
  function build(d) {
    es = d.es !== false;
    applyTheme(d.theme);
    panel.textContent = '';
    panel.appendChild(el('div', 'hd', d.name || ''));
    panel.appendChild(item(ICO_PIN, T('Quitar de la barra', 'Unpin from toolbar'), '', () => api.unpin()));
    panel.appendChild(item(ICO_OPT, T('Opciones de la extensi\u00f3n', 'Extension options'), d.options ? '' : 'off', () => api.options()));
    if (d.removable) {
      panel.appendChild(el('div', 'sep'));
      panel.appendChild(item(ICO_DEL, d.confirm ? T('\u00bfSeguro? Pulsa otra vez', 'Sure? Click again') : T('Desinstalar', 'Uninstall'), 'danger' + (d.confirm ? ' sure' : ''), () => api.remove()));
    }
    const h = Math.ceil(panel.getBoundingClientRect().height) + 16;
    if (h !== lastH) { lastH = h; api.size(h); }
  }
  api.onData(build);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') api.close(); });
</script>
</body>
</html>
