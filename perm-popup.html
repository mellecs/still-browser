<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Permission</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:13px 'Inter','Segoe UI',system-ui,sans-serif;user-select:none;color:var(--text,#fff)}
#shade{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.28);display:flex;align-items:flex-start;justify-content:center;padding-top:90px}
#box{width:360px;max-width:92vw;padding:14px;border-radius:16px;background:var(--bg,#292a2d);border:1px solid var(--border,#3c3d40);box-shadow:0 10px 32px rgba(0,0,0,.55);animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(4px)}to{opacity:1;transform:none}}
#host{font-size:14px;font-weight:600;padding:2px 4px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wants{color:var(--muted,#c4c7c5);padding:0 4px 10px}
#what{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--text,#fff) 8%,var(--bg,#292a2d));font-weight:600;margin-bottom:12px}
#rem{display:flex;align-items:center;gap:8px;padding:0 4px 14px;color:var(--muted,#c4c7c5);cursor:pointer}
#rem input{-webkit-appearance:none;appearance:none;flex:none;width:18px;height:18px;margin:0;border-radius:6px;border:2px solid color-mix(in srgb,var(--text,#fff) 40%,transparent);background:transparent;cursor:pointer;display:grid;place-content:center;transition:background .12s,border-color .12s} /* CASILLA_REDONDA */
#rem input:hover{border-color:var(--accent,#5b9bff)}
#rem input:checked{background:var(--accent,#5b9bff);border-color:var(--accent,#5b9bff)}
#rem input:checked::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
#buttons{display:flex;justify-content:flex-end;gap:8px}
button.act{height:34px;padding:0 18px;border:none;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
#block{background:color-mix(in srgb,var(--text,#fff) 10%,var(--bg,#292a2d));color:var(--text,#fff)}
#block:hover{background:color-mix(in srgb,var(--text,#fff) 16%,var(--bg,#292a2d))}
#allow{background:var(--accent,#5b9bff);color:#fff}
#allow:hover{filter:brightness(1.12)}
</style>
</head>
<body>
<div id="shade">
  <div id="box">
    <div id="host"></div>
    <div id="wants"></div>
    <div id="what"></div>
    <label id="rem"><input type="checkbox" id="chk"><span id="remtxt"></span></label>
    <div id="buttons">
      <button class="act" id="block"></button>
      <button class="act" id="allow"></button>
    </div>
  </div>
</div>
<script>
let data = null;
function $(id) { return document.getElementById(id); }
function render() {
  if (!data) return;
  const th = data.theme || {};
  const r = document.documentElement.style;
  if (th.bg) r.setProperty('--bg', th.bg);
  if (th.border) r.setProperty('--border', th.border);
  if (th.text) r.setProperty('--text', th.text);
  if (th.muted) r.setProperty('--muted', th.muted);
  if (th.accent) r.setProperty('--accent', th.accent);
  const T = data.text || {};
  $('host').textContent = data.host || '';
  $('wants').textContent = T.wants || '';
  $('what').textContent = data.what || '';
  $('remtxt').textContent = T.remember || '';
  $('block').textContent = T.block || '';
  $('allow').textContent = T.allow || '';
  $('chk').checked = false;
}
$('allow').onclick = () => window.permApi.answer(true, $('chk').checked);
$('block').onclick = () => window.permApi.answer(false, $('chk').checked);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') window.permApi.answer(false, false);
});
if (window.permApi) {
  window.permApi.onData((d) => { data = d; render(); });
}
</script>
</body>
</html>
