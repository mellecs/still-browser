<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #292a2d; --hover: #3a3b3f; --border: #3c3d40; --text: #ffffff; --muted: #c4c7c5; --accent: #5b9bff; }
  html, body { margin: 0; background: transparent; overflow: hidden;
    font: 13px 'Inter', 'Segoe UI', system-ui, sans-serif; color: var(--text); user-select: none; }
  body { padding: 8px; }
  #panel { box-sizing: border-box; padding: 10px; border-radius: 16px; background: var(--bg);
    border: 1px solid var(--border); box-shadow: 0 10px 32px rgba(0,0,0,0.55); }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 8px; font-weight: 600; }
  .x { width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent;
    color: var(--muted); cursor: pointer; font-size: 18px; line-height: 24px; padding: 0; }
  .x:hover { background: var(--hover); color: var(--text); }
  .item { padding: 8px 6px; }
  .item + .item { border-top: 1px solid var(--border); }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .bar { height: 4px; border-radius: 2px; background: var(--hover); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
  .bar.indet i { width: 40%; animation: ind 1.1s ease-in-out infinite alternate; }
  @keyframes ind { from { margin-left: 0; } to { margin-left: 60%; } }
  .acts { display: flex; gap: 14px; margin-top: 6px; }
  .link { border: 0; background: transparent; color: var(--accent); cursor: pointer; padding: 2px 0; font: inherit; }
  .link:hover { text-decoration: underline; }
  .empty { padding: 14px 6px; color: var(--muted); }
  .all { display: block; width: 100%; margin-top: 6px; height: 34px; border: 0; border-radius: 8px;
    background: var(--hover); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
  .all:hover { filter: brightness(1.2); }
</style>
</head>
<body>
<div id="panel"></div>
<script>
  const api = window.dlApi;
  const panel = document.getElementById('panel');
  let es = true, key = '', refs = {}, lastH = 0;
  const T = (a, b) => (es ? a : b); const applyTheme = (th) => { try { const r = document.documentElement.style; Object.keys(th || {}).forEach((k) => r.setProperty('--' + k, th[k])); } catch (e) {} };
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fmt(n) {
    if (!(n > 0)) return '0 B';
    const u = ['B', 'KB', 'MB', 'GB'];
    let i = 0;
    while (n >= 1024 && i < 3) { n /= 1024; i++; }
    return n.toFixed(i ? 1 : 0) + ' ' + u[i];
  }
  function pct(it) { return it.total > 0 ? Math.min(100, Math.round((it.received / it.total) * 100)) : 0; }
  /* ETA_DESCARGA: velocidad medida entre actualizaciones y tiempo restante */
  const spd = {};
  function track(it) {
    const now = Date.now(); const s = spd[it.id];
    if (!s) { spd[it.id] = { t: now, r: it.received, v: 0 }; return; }
    const dt = (now - s.t) / 1000;
    if (dt < 0.4) return;
    const inst = Math.max(0, (it.received - s.r) / dt);
    s.v = s.v > 0 ? s.v * 0.7 + inst * 0.3 : inst;
    s.t = now; s.r = it.received;
  }
  function etaText(it) {
    const s = spd[it.id];
    if (!s || !(s.v > 1)) return T('calculando\u2026', 'calculating\u2026');
    const sec = Math.max(1, Math.ceil((it.total - it.received) / s.v));
    let t;
    if (sec < 60) t = sec + ' s';
    else if (sec < 3600) t = Math.ceil(sec / 60) + ' min';
    else t = Math.floor(sec / 3600) + ' h ' + Math.ceil((sec % 3600) / 60) + ' min';
    return es ? 'quedan ' + t : t + ' left';
  }
  function subText(it) {
    if (it.state === 'progressing' || it.state === 'paused') {
      let s = it.total > 0 ? fmt(it.received) + ' / ' + fmt(it.total) + ' (' + pct(it) + '%)' : fmt(it.received);
      if (it.state === 'progressing' && it.total > 0) s += ' \u00b7 ' + etaText(it);
      if (it.state === 'paused') s += ' \u00b7 ' + T('En pausa', 'Paused');
      return s;
    }
    if (it.state === 'completed') return T('Completada', 'Completed') + (it.total > 0 ? ' \u00b7 ' + fmt(it.total) : '');
    if (it.state === 'cancelled') return T('Cancelada', 'Cancelled');
    return T('Interrumpida', 'Interrupted');
  }
  function link(text, fn) { const b = el('button', 'link', text); b.onclick = fn; return b; }
  function build(d) {
    refs = {};
    panel.textContent = '';
    const head = el('div', 'head');
    head.appendChild(el('span', '', T('Descargas', 'Downloads')));
    const x = el('button', 'x', '\u00d7');
    x.onclick = () => api.close();
    head.appendChild(x);
    panel.appendChild(head);
    if (!d.items.length) panel.appendChild(el('div', 'empty', T('No hay descargas', 'No downloads')));
    d.items.forEach((it) => {
      const row = el('div', 'item');
      row.appendChild(el('div', 'name', it.name));
      const sub = el('div', 'sub', subText(it));
      row.appendChild(sub);
      const act = it.state === 'progressing' || it.state === 'paused';
      let fill = null;
      if (act) {
        const bar = el('div', 'bar');
        fill = document.createElement('i');
        if (it.total > 0) fill.style.width = pct(it) + '%'; else bar.classList.add('indet');
        bar.appendChild(fill);
        row.appendChild(bar);
      }
      const acts = el('div', 'acts');
      if (act) acts.appendChild(link(T('Cancelar', 'Cancel'), () => api.cancel(it.id)));
      else if (it.state === 'completed') {
        acts.appendChild(link(T('Abrir', 'Open'), () => api.open(it.id)));
        acts.appendChild(link(T('Mostrar en carpeta', 'Show in folder'), () => api.show(it.id)));
      }
      if (acts.children.length) row.appendChild(acts);
      refs[it.id] = { sub: sub, fill: fill };
      panel.appendChild(row);
    });
    const all = el('button', 'all', T('Ver todas las descargas', 'See all downloads'));
    all.onclick = () => api.all();
    panel.appendChild(all);
    const h = Math.ceil(panel.getBoundingClientRect().height) + 16;
    if (h !== lastH) { lastH = h; api.size(h); }
  }
  api.onData((d) => {
    es = d.es !== false; applyTheme(d.theme); d.items.forEach(track);
    const k = es + '|' + d.items.map((i) => i.id + ':' + i.state + ':' + (i.total > 0)).join(',');
    if (k !== key) { key = k; build(d); return; }
    d.items.forEach((it) => {
      const r = refs[it.id];
      if (!r) return;
      r.sub.textContent = subText(it);
      if (r.fill && it.total > 0) r.fill.style.width = pct(it) + '%';
    });
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') api.close(); });
</script>
</body>
</html>
