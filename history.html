<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Historial</title>
<style>
body{margin:0;background:#1e1f22;color:#e3e3e3;font-family:'Segoe UI',system-ui,sans-serif}
#wrap{max-width:820px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:22px;font-weight:600;margin:0 0 18px}
#top{display:flex;gap:10px;margin-bottom:10px}
#q{flex:1;height:36px;border:none;border-radius:8px;background:#292a2d;color:#fff;padding:0 14px;font-size:14px;outline:none}
#q:focus{box-shadow:0 0 0 2px #5b9bff}
#clear{height:36px;padding:0 14px;border:none;border-radius:8px;background:#3a3b3f;color:#e3e3e3;cursor:pointer;font-size:13px}
#clear:hover{background:#55565a}
.day{margin:22px 0 6px;font-size:13px;color:#9aa0a6;text-transform:capitalize}
.item{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;cursor:pointer}
.item:hover{background:#292a2d}
.time{flex:none;width:44px;font-size:12px;color:#9aa0a6}
.info{flex:1;min-width:0}
.title,.host{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{font-size:14px}
.host{font-size:12px;color:#9aa0a6}
.del{flex:none;width:26px;height:26px;border:none;border-radius:50%;background:transparent;color:#9aa0a6;cursor:pointer;font-size:14px;visibility:hidden}
.item:hover .del{visibility:visible}
.del:hover{background:#4a4b4f;color:#fff}
#empty{color:#9aa0a6;margin-top:40px;text-align:center}
</style>
</head>
<body>
<div id="wrap">
  <h1>Historial</h1>
  <div id="top">
    <input id="q" type="text" placeholder="Buscar en el historial">
    <button id="clear">Borrar todo</button>
  </div>
  <div id="list"></div>
</div>
<script>
let all = [];
const list = document.getElementById('list');
const q = document.getElementById('q');

function dia(t) {
  const d = new Date(t);
  if (d.toDateString() === new Date().toDateString()) return 'Hoy';
  if (d.toDateString() === new Date(Date.now() - 864e5).toDateString()) return 'Ayer';
  return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } }

function render() {
  const term = q.value.trim().toLowerCase();
  const items = all.filter((h) => !term || (h.title || '').toLowerCase().includes(term) || h.url.toLowerCase().includes(term)).slice(0, 500);
  list.innerHTML = '';
  if (!items.length) {
    const e = document.createElement('div');
    e.id = 'empty';
    e.textContent = term ? 'Sin resultados' : 'Aún no hay historial';
    list.appendChild(e);
    return;
  }
  let last = '';
  items.forEach((h) => {
    const d = dia(h.time);
    if (d !== last) {
      last = d;
      const e = document.createElement('div');
      e.className = 'day';
      e.textContent = d;
      list.appendChild(e);
    }
    const row = document.createElement('div');
    row.className = 'item';
    row.onclick = () => window.historyApi.open(h.url);

    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = new Date(h.time).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

    const info = document.createElement('div');
    info.className = 'info';
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = h.title || h.url;
    const hst = document.createElement('div');
    hst.className = 'host';
    hst.textContent = host(h.url);
    info.appendChild(title);
    info.appendChild(hst);

    const del = document.createElement('button');
    del.className = 'del';
    del.title = 'Quitar del historial';
    del.textContent = '✕';
    del.onclick = (ev) => {
      ev.stopPropagation();
      window.historyApi.remove(h.time, h.url).then((l) => { all = l; render(); });
    };

    row.appendChild(time);
    row.appendChild(info);
    row.appendChild(del);
    list.appendChild(row);
  });
}

function cargar() { window.historyApi.get().then((l) => { all = l; render(); }); }
q.addEventListener('input', render);
document.getElementById('clear').onclick = () => {
  if (confirm('¿Borrar todo el historial?')) window.historyApi.clear().then((l) => { all = l; render(); });
};
window.addEventListener('focus', cargar);
cargar();
</script>
</body>
</html>
