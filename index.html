<style>
    /* animacion del icono de descargas */
    #downloads { position: relative; overflow: hidden; }
    #downloads::after {
      content: '';
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 2px;
      height: 2px;
      border-radius: 1px;
      background: var(--ring);
      transform-origin: left;
      transform: scaleX(var(--p, 0));
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.2s ease;
    }
    #downloads.active { color: var(--ring); }
    #downloads.active::after { opacity: 1; }
    #downloads.indet::after { transform: none; animation: dl-indet 1.2s linear infinite; }
    #downloads.active svg path:nth-child(-n+2) { animation: dl-bob 0.9s ease-in-out infinite; }
    #downloads.done { color: var(--ring); }
    #downloads.done svg { animation: dl-done 0.6s ease 3; }
    @keyframes dl-bob { 0%, 100% { transform: translateY(-1.5px); } 50% { transform: translateY(2px); } }
    @keyframes dl-done { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
    @keyframes dl-indet { 0% { transform: translateX(-100%) scaleX(0.4); } 100% { transform: translateX(200%) scaleX(0.4); } }

<script>
    // Temas de la barra de direcciones y de las pestanas

      oceano: { h: 215, s: 35, l: 12 },
      bosque: { h: 150, s: 28, l: 11 },
      violeta: { h: 265, s: 32, l: 13 },
      ambar: { h: 30, s: 35, l: 12 },
      rosa: { h: 335, s: 32, l: 13 }
    };
    const BAR_VARS = ['--bg', '--text', '--muted', '--tab-hover', '--tab-active', '--tab-active-text', '--close-hover', '--toolbar', '--btn-text', '--btn-hover', '--address-bg', '--ring'];
    function customHsl(hex) {
      if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return null;
      const n = parseInt(hex.slice(1), 16);
      const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
      let h = 0;
      if (d) {
        if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
        h *= 60; if (h < 0) h += 360;
      }
      const l = (mx + mn) / 2;
      const sat = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
      return { h: Math.round(h), s: sat < 0.08 ? 0 : Math.round(Math.min(45, 15 + sat * 30)), l: Math.round(7 + l * 15) };
    }
    function applyBarTheme(id, customColor) {
      BAR_VARS.forEach((v) => document.body.style.removeProperty(v));
      const t = (id === 'personalizado') ? customHsl(customColor) : BAR_THEMES[id];
      if (!t) return;
      const c = (l) => 'hsl(' + t.h + ' ' + t.s + '% ' + l + '%)';
      const soft = (l) => 'hsl(' + t.h + ' ' + Math.min(t.s, 15) + '% ' + l + '%)';
      const vals = {
        '--bg': c(t.l),
        '--text': '#f5f5f5',
        '--muted': soft(76),
        '--tab-hover': c(t.l + 8),
        '--tab-active': c(t.l + 15),
        '--tab-active-text': '#f5f5f5',
        '--close-hover': c(t.l + 22),

        '--btn-hover': c(t.l + 16),

      const next = document.getElementById('findnext');

      const T = {
        en: { ph: 'Find in page', prev: 'Previous (Shift+Enter)', next: 'Next (Enter)', close: 'Close (Esc)', none: 'No results' },
        es: { ph: 'Buscar en la p\u00e1gina', prev: 'Anterior (May\u00fas+Enter)', next: 'Siguiente (Enter)', close: 'Cerrar (Esc)', none: 'Sin resultados' }

      let lang = 'es';
      function txt() { return T[lang] || T.es; }
      function applyLang() {

    })();
