<style>
    /* temas: el tema Actual usa estos valores, que son los de siempre */
    body {
      --bg: #1e1f22; --text: #ffffff; --muted: #c4c7c5;
      --tab-hover: #2f3033; --tab-active: #3c3d40; --tab-active-text: #f1f3f4;
      --close-hover: #4a4b4f; --toolbar: #292a2d; --btn-text: #e3e3e3;
      --btn-hover: #3a3b3f; --address-bg: #1e1f22; --ring: #5b9bff;
    }
    body { background: var(--bg); }
    #tabbar { background: var(--toolbar); } /* TABBAR_COMO_TOOLBAR */
    .tab { color: var(--muted); }
    .tab:hover { background: var(--tab-hover); }
    .tab.active { background: var(--tab-active); color: var(--tab-active-text); }
    .tab.active:hover { background: var(--tab-active); }
    .tab-close { color: var(--muted); }
    .tab-close:hover { background: var(--close-hover); color: #ffffff; }
    #newtab { color: var(--muted); }
    #newtab:hover { background: var(--btn-hover); color: #ffffff; }
    .tab-audio:hover { background: var(--close-hover); color: #ffffff; }
    #toolbar { background: var(--toolbar); }
    #toolbar button { color: var(--btn-text); }
    #toolbar button:hover { background: var(--btn-hover); color: #ffffff; }
    #address { background: var(--address-bg); color: var(--text); }
    #address:focus { background: var(--address-bg); box-shadow: 0 0 0 2px var(--ring); }
  </style>

<style>
    /* DESCARGA_ZEN: la flecha se llena de color segun el progreso */
    #downloads { position: relative; overflow: visible; }
    #downloads.active svg path { stroke: url(#dlGrad); }
    #downloads.indet svg path { stroke: var(--ring); }
    #downloads.indet svg path:nth-child(-n+2) { animation: dl-bob 0.9s ease-in-out infinite; }
    #downloads.dl-start svg { animation: dl-pop 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
    #downloads.dl-start svg path:nth-child(-n+2) { animation: dl-drop 0.5s cubic-bezier(0.3, 1.3, 0.5, 1); }
    #downloads.done { color: var(--ring); }
    #downloads.done svg { animation: dl-done 0.5s ease 1; }
    @keyframes dl-pop { from { transform: scale(0.7); } to { transform: scale(1); } }
    @keyframes dl-drop { from { transform: translateY(-7px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes dl-bob { 0%, 100% { transform: translateY(-1.5px); } 50% { transform: translateY(2px); } }
    @keyframes dl-done { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  </style>
<style>
    /* candado de la barra de direcciones */
    #addrwrap { position: relative; min-width: 0; }
    #lock {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      pointer-events: auto;
    }
    #addrwrap.has-lock #lock { display: flex; }
    #addrwrap.has-lock #address { padding-left: 32px; }
    #lock svg, body.compact #lock svg { width: 14px; height: 14px; }
    #lock.secure { color: var(--muted); }
    #lock { isolation: isolate; -webkit-app-region: no-drag; }
    #lock::before { content: ''; position: absolute; inset: -5px; border-radius: 7px; background: transparent; transition: background 0.12s; z-index: -1; }
    #lock:hover::before { background: var(--btn-hover, #3a3b3f); }
    #lock.insecure { color: #ff8a65; }
    /* CANDADO_IZQUIERDA: el candado es el boton, pegado a la izquierda de la barra */
    #lock { left: 3px; width: 22px; height: 22px; align-items: center; justify-content: center; border-radius: 7px; cursor: pointer; transition: background 0.12s; }
    #lock::before { display: none; }
    #lock:hover { background: rgba(255, 255, 255, 0.14); }
    body.compact #lock { width: 20px; height: 20px; }
  </style>
<style>
    /* indicador de carga en la pestaña */
    .tab-icon .spinner {
      width: 14px;
      height: 14px;
      box-sizing: border-box;
      border: 2px solid var(--close-hover);
      border-top-color: var(--ring);
      border-radius: 50%;
      animation: tab-spin 0.8s linear infinite;
    }
    @keyframes tab-spin { to { transform: rotate(360deg); } }
  </style>
<style>

    #findbar {

<script>/* SB_BARRA_V5: barra larga y centrada entre los botones de la izquierda y los de la derecha */

<script>/* PIN_COLOR_FAVICON */
(() => {
  const tabsEl = document.getElementById('tabs');
  if (!tabsEl) return;
  const cache = new Map();
  const dominante = (img) => {
    try {
      const c = document.createElement('canvas'); c.width = 16; c.height = 16;
      const x = c.getContext('2d', { willReadFrequently: true });
      x.drawImage(img, 0, 0, 16, 16);
      const d = x.getImageData(0, 0, 16, 16).data;
      const b = Array.from({ length: 12 }, () => ({ w: 0, r: 0, g: 0, b: 0 }));
      let tr = 0, tg = 0, tb = 0, tn = 0;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], bl = d[i + 2], a = d[i + 3];

        const s = (mx - mn) / mx;
        if (s < 0.25) continue;
        let h;
        if (mx === mn) h = 0;
        else if (mx === r) h = ((g - bl) / (mx - mn) + 6) % 6;
        else if (mx === g) h = (bl - r) / (mx - mn) + 2;
        else h = (r - g) / (mx - mn) + 4;
        const k = Math.min(11, Math.floor(h * 2));
        const w = s * (mx / 255);
        b[k].w += w; b[k].r += r * w; b[k].g += g * w; b[k].b += bl * w;
      }
      let best = null;
      b.forEach((e) => { if (e.w > 0 && (!best || e.w > best.w)) best = e; });
      if (best) return 'rgb(' + Math.round(best.r / best.w) + ',' + Math.round(best.g / best.w) + ',' + Math.round(best.b / best.w) + ')';
      if (tn) return 'rgb(' + Math.round(tr / tn) + ',' + Math.round(tg / tn) + ',' + Math.round(tb / tn) + ')';
    } catch (e) {}
    return '';
  };
  const poner = (tab, col) => { if (col) tab.style.setProperty('--pin-color', col); else tab.style.removeProperty('--pin-color'); };
  const revisar = () => {
    tabsEl.querySelectorAll('.tab.pinned').forEach((tab) => {
      const im = tab.querySelector('.tab-icon img');
      if (!im || !im.src) { poner(tab, ''); return; }
      const src = im.src;
      if (cache.has(src)) { poner(tab, cache.get(src)); return; }

})();

    if (!raf) raf = requestAnimationFrame(() => { raf = 0; try { window.chorus.sidebarWidthSet(cur, false); } catch (er) {} });
  });
  const fin = () => { if (!drag) return; drag = false; document.body.style.userSelect = ''; try { window.chorus.sidebarWidthSet(cur, true); } catch (er) {} };
  h.addEventListener('pointerup', fin);
  h.addEventListener('pointercancel', fin);
  h.addEventListener('dblclick', () => { cur = 152; setW(152); try { window.chorus.sidebarWidthSet(152, true); } catch (er) {} });
})();
</script>
<script>/* SPLIT_LADO */
window.__ladoSplit = function (ev, bx) {
  var top = 40, w = window.innerWidth - bx, h = window.innerHeight - top;
  var fx = (ev.clientX - bx) / Math.max(1, w), fy = (ev.clientY - top) / Math.max(1, h);
  if (fy < 0.25) return 'top';
  if (fy > 0.75) return 'bottom';
  return fx < 0.5 ? 'left' : 'right';
};
</script>
<script>/* SB_RESYNC: tras pantalla completa, reaplica estado y ancho de la barra lateral */
(() => {
  let t = 0;
  const sync = () => {
    try { window.chorus.getSidebarState().then((v) => document.body.classList.toggle('side-hidden', !!v)); } catch (e) {}
    try { window.chorus.sidebarWidthGet().then((w) => document.documentElement.style.setProperty('--sbw', w + 'px')); } catch (e) {}
  };
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(sync, 150); });
})();
</script>
